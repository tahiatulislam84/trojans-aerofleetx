name: Android clean build and tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out exact source revision
        uses: actions/checkout@v4

      - name: Record checked out source revision
        shell: bash
        run: |
          echo "Event SHA: ${GITHUB_SHA}"
          echo "Checked out SHA: $(git rev-parse HEAD)"
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up pinned Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Set up Android SDK command-line tools
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;35.0.0"

      - name: Generate the pinned Gradle wrapper
        shell: bash
        run: |
          gradle wrapper --gradle-version 8.13 --distribution-type bin
          grep -F "distributionUrl=https\\://services.gradle.org/distributions/gradle-8.13-bin.zip" gradle/wrapper/gradle-wrapper.properties
          grep -F "distributionSha256Sum=20f1b1176237254a6fc204d8434196fa11a4cfb387567519c61556e8710aed78" gradle/wrapper/gradle-wrapper.properties
          ./gradlew --no-daemon --version

      - name: Clean Android compile, lint, and debug APK
        shell: bash
        run: ./gradlew --no-daemon --stacktrace clean lintDebug assembleDebug

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run source-level regression tests
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
          pytest -m "not browser" -q

      - name: Run browser workflow validation
        shell: bash
        run: |
          python -m playwright install --with-deps chromium
          pytest -m browser -q

      - name: Upload reproducibility evidence
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: aerofleetx-clean-build-evidence-${{ github.sha }}
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/reports/**
            test-results/**
          if-no-files-found: warn
          retention-days: 30
